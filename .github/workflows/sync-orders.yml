name: sync-orders

# 只在 Actions 頁面手動執行。沒有排程。
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-orders
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 從訂單 API 更新公開投影
        env:
          ORDERS_API_TOKEN: ${{ secrets.ORDERS_API_TOKEN }}
        run: python -m sync.sync_orders
      - name: 內容有變才提交
        id: save
        run: |
          git add -- data/public.json img
          if [ -f data/image-cache.json ]; then git add -- data/image-cache.json; fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git -c user.name="ginhiji-buyer sync" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "同步訂單公開資料"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: 請求 GitHub Pages 重建
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" > /tmp/pages-build.json
          python -c 'import json; print("pages_build_status", json.load(open("/tmp/pages-build.json")).get("status"))'
